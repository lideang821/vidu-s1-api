<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vidu S2-Editing · Vidu S2</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-demo="editing">
<main class="shell">
  <header class="topbar">
    <div><a class="eyebrow" href="/">Vidu S API / Node quickstart</a><h1>Vidu S2-Editing</h1></div>
    <div class="toolbar"><a href="/avatar">Avatar</a><a href="/editing">Editing</a>
      <select id="language" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select>
    </div>
  </header>
  <div class="session-bar"><span class="status-pill" id="apiKeyState" data-i18n="checking">Checking config</span><span id="hostLabel"></span><span class="status-pill" id="sessionState" data-i18n="idle">Idle</span></div>
  <p id="notice" role="status" class="notice" hidden></p>
  <section class="workspace">
    <div class="control-column">
      <form class="panel form-panel" id="createForm"><h2 data-i18n="createSession">Create session</h2>
        <fieldset id="createFields">
      <label><span data-i18n="editingType">Editing scenario</span><select name="editing_type"><option value="style_transfer" data-i18n="styleTransfer">Style transfer</option><option value="virtual_tryon" data-i18n="virtualTryon">Virtual try-on</option><option value="subject_replacement" data-i18n="subjectReplacement">Subject replacement</option><option value="background_replacement" data-i18n="backgroundReplacement">Background replacement</option></select></label>
      <div class="image-input">
      <label><span data-i18n="referenceImage">Reference image</span>
        <select id="imageSource"><option value="preset" data-i18n="sampleImage">Sample image</option><option value="url" data-i18n="imageUrl">Image URL</option><option value="file" data-i18n="localImage">Local image</option></select></label>
      <input id="imageUrl" aria-label="Image URL" type="text" placeholder="https://example.com/reference.png">
      <input id="imageFile" aria-label="Local image" type="file" accept="image/*" hidden>
      <p id="imageHint" class="hint sample-hint" hidden></p>
      <img id="imagePreview" class="image-preview" alt="Reference preview" hidden>
    </div><button class="primary" id="startButton" type="submit" disabled data-i18n="start">Create and connect</button></fieldset>
        <button class="danger" id="hangupButton" type="button" disabled data-i18n="hangup">Hang up</button>
      </form>
      <form id="interactionForm" class="panel form-panel"><h2 data-i18n="switchTitle">Change image / scenario</h2><fieldset id="interactionFields" disabled>
      <label><span data-i18n="editingType">Editing scenario</span><select id="switchEditingType"><option value="style_transfer" data-i18n="styleTransfer">Style transfer</option><option value="virtual_tryon" data-i18n="virtualTryon">Virtual try-on</option><option value="subject_replacement" data-i18n="subjectReplacement">Subject replacement</option><option value="background_replacement" data-i18n="backgroundReplacement">Background replacement</option></select></label>
      <div class="image-input">
      <label><span data-i18n="newImage">New reference image (optional)</span>
        <select id="switchImageSource"><option value="preset" data-i18n="sampleImage">Sample image</option><option value="keep" data-i18n="keepImage">Keep current image</option><option value="url" data-i18n="imageUrl">Image URL</option><option value="file" data-i18n="localImage">Local image</option></select></label>
      <input id="switchImageUrl" aria-label="Image URL" type="text" placeholder="https://example.com/reference.png" hidden>
      <input id="switchImageFile" aria-label="Local image" type="file" accept="image/*" hidden>
      <p id="switchImageHint" class="hint sample-hint" hidden></p>
      <img id="switchImagePreview" class="image-preview" alt="Reference preview" hidden>
    </div>
      <button class="primary" type="submit" data-i18n="applyEdit">Apply change</button>
      <p class="hint" data-i18n="switchHint">The image changes after a few seconds. A successful switch has no acknowledgement.</p></fieldset></form>
    </div>
    <section class="panel session-panel">
      <div class="media-grid">
        <figure class="media-tile"><video id="localVideo" autoplay playsinline muted></video><figcaption data-i18n="localPreview">Local preview</figcaption></figure>
        <figure class="media-tile"><video id="remoteVideo" autoplay playsinline controls muted></video><figcaption data-i18n="editedResult">Edited result</figcaption></figure>
      </div>
      <h3 data-i18n="sessionDetails">Session / RTC details</h3><pre id="sessionOutput">{}</pre>
      <div class="panel-head log-head"><h3 data-i18n="eventLog">Event log</h3><button id="clearLog" type="button" data-i18n="clearLog">Clear log</button></div><ul id="eventLog" class="event-log" aria-live="polite"></ul>
    </section>
  </section>
</main>
<script src="/i18n.js" type="module"></script>
<script src="https://g.alicdn.com/apsara-media-box/imp-web-rtc/7.1.9/aliyun-rtc-sdk.js"></script>
<script src="/app.js" type="module"></script>
</body>
</html>
